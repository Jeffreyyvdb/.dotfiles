# Slot files for ~/.agents/bin/heavy, created at login by systemd-tmpfiles --user.
# A sandboxed agent command (Codex) may be unable to create files in /run/user, but
# can still flock an existing one read-only. heavy creates any missing ones itself.
d %t/heavy-jobs 0700 - - -
f %t/heavy-jobs/slot.0 0600 - - -
f %t/heavy-jobs/slot.1 0600 - - -
f %t/heavy-jobs/slot.2 0600 - - -
f %t/heavy-jobs/slot.3 0600 - - -
