# Claude Code temp files (session scratchpads, command output) go to disk, not /tmp.
# On systemd 258+ /tmp is a tmpfs with a per-user quota of 80%, held in RAM and swap,
# and a full quota makes every Claude shell command fail with EDQUOT. Reaches systemd
# user services (T3 Code, remote control) and sessions that import environment.d.
# Old files are aged out by .config/user-tmpfiles.d/agent-tmp.conf.
CLAUDE_CODE_TMPDIR=${HOME}/.cache/claude-tmp
