# Age out agent temp files; nothing else cleans them before a reboot. Run daily by
# systemd-tmpfiles-clean.timer --user. %h/.cache/claude-tmp is CLAUDE_CODE_TMPDIR
# (.config/environment.d/50-claude-tmpdir.conf); the /tmp lines catch older sessions
# and Node's compile cache, which count against the /tmp quota.
e %h/.cache/claude-tmp/claude-%U - - - 7d
e /tmp/claude-%U - - - 3d
e /tmp/node-compile-cache - - - 3d
