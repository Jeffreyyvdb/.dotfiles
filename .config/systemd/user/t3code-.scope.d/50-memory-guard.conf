# Memory guard for every T3 Code agent scope (t3code-claude-*, t3code-opencode-*,
# t3code-preview-browser-*, ...). T3 starts each agent with systemd-run --scope in
# app.slice/app-t3code.slice/app-t3code-agents.slice/..., and this prefix drop-in
# reaches those transient scopes, including ones already running at daemon-reload.
#
# Why: Omarchy marks app.slice ManagedOOMMemoryPressure=kill, and systemd-oomd picks the scope
# with the highest page-scan rate, not the biggest one. On a 15 GB machine (2026-11-16) one
# runaway Codex scope (7.9G + 10G swap) pushed app.slice pressure past 50%, and oomd
# first killed a 1.2G Claude session that was merely reclaiming at the time.
#
# MemoryMax makes a runaway hit its own ceiling first. The kernel then OOM-kills the
# biggest process inside that scope (a svelte-check, a vite build, a browser), and
# OOMPolicy=continue keeps the agent itself alive (the default, stop, would end the
# whole session). MemorySwapMax keeps one scope from parking gigabytes in zram, which
# is RAM too. Percentages are of physical RAM, so this is sane on any machine size.
# No MemoryHigh here: just under MemoryMax it throttles a hog for minutes instead of
# killing it; T3 already sets one on app-t3code-agents.slice as a whole.
[Scope]
OOMPolicy=continue
MemoryMax=40%
MemorySwapMax=2G
